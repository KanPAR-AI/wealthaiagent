# Secret-scan policy (docs/52-leak-register.md in the parent repo). CI
# gate: a NEW finding fails the build. Allowlist entries carry reasons.
title = "wealthaiagent gitleaks policy"

[extend]
useDefault = true

[allowlist]
description = "Reviewed non-secrets (docs/52)"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.env\.local$''',
  # Firebase CLIENT config — public by design; shipped in every app
  # bundle. Access control is Firebase security rules, not key secrecy.
  '''google-services\.json$''',
  '''GoogleService-Info\.plist$''',
  '''apps/astro/src/lib/env\.ts$''',
  # Same rationale, KneeFit's registrations (2026-09-05).
  '''apps/knee/src/lib/env\.ts$''',
  # Dependency lockfile integrity checksums, not credentials.
  '''Podfile\.lock$''',
  '''Manifest\.lock$''',
  # Build outputs — gitignored; quiet the filesystem scan.
  '''apps/[^/]+/(ios|android)/(build|build_out|Pods)/''',
  '''apps/[^/]+/dist/''',
  '''node_modules/''',
  # More gitignored build output: android incremental caches, the web
  # app's dist bundle, and the Capacitor iOS public copy of it.
  '''android/app/build/''',
  '''/dist/assets/''',
  '''ios/App/App/public/''',
]
regexes = [
  '''AIzaSyBaV0-3rpmqPwwmF-DxrzOxo7RMeZGPxc0''',
  # People-store PAIR KEYS — `p_<12 hex>__self` / `p_<12 hex>__p_<12 hex>`.
  # An opaque id naming two person records, not a credential: it grants
  # nothing without the owner's own token. The generic-api-key rule fires on
  # the word "key" beside hex (ten hits in the extension's captured match
  # fixtures failed build 0480841c, 2026-09-20). Allowlisted by SHAPE, not by
  # path, so a real secret pasted into a fixture is still caught.
  '''p_[0-9a-f]{12}__(?:self|p_[0-9a-f]{12})''',
]
