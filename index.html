<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- interactive-widget=resizes-content: when the on-screen keyboard
         opens on iOS / Android, resize the layout viewport instead of
         scrolling the document. Without it, iOS Safari/Chrome scrolls
         the body to bring the focused input into view, dragging the
         top bar (and any other in-flow elements) out of the visible area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Replaces deprecated apple-mobile-web-app-capable warning in
         modern Chrome. Both kept for legacy iOS support. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <title>WealthWise AI</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Your personal AI-powered financial advisor for smart investment decisions" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WealthWise AI" />
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Bug a0d78f0f: if the main bundle never runs (a cached index.html
         pointing at a purged hash, a blocked script, a hard JS error before
         React mounts), #root stays empty and the user sees a white page with
         no explanation. This runs without the bundle: once the script has
         failed to load, or after a generous wait with nothing drawn, it says
         so and offers a reload. React's own error boundary takes over the
         moment the bundle is alive. -->
    <script>
      (function () {
        var shown = false;
        function show(title, reason) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;
          shown = true;
          root.innerHTML =
            '<div role="alert" style="font-family:system-ui,sans-serif;max-width:28rem;margin:15vh auto;padding:1.25rem;border:1px solid #e5e7eb;border-radius:.5rem;color:#111">' +
            '<h1 style="font-size:1rem;margin:0 0 .5rem">' + title + '</h1>' +
            '<p style="font-size:.875rem;color:#555;margin:0 0 .75rem">' + reason + '</p>' +
            '<button type="button" onclick="location.reload()" style="font-size:.875rem;padding:.4rem .8rem;border-radius:.375rem;border:1px solid #d1d5db;background:#2563eb;color:#fff">Reload</button>' +
            '</div>';
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && t.type === 'module') {
            show('The app could not start', 'A script this page needs failed to load. This usually means the app was updated while this tab was open.');
          }
        }, true);
        // The main bundle is ~3 MB; on a slow link 12 s was not enough and
        // "could not start" would have been a lie. Say "still loading" and
        // wait longer - React replaces this the moment it mounts.
        setTimeout(function () {
          show('Still loading\u2026', 'The app has not drawn anything after 25 seconds. A slow connection can take this long; if nothing appears soon, reload.');
        }, 25000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
