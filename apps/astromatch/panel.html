<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AstroMatch</title>
    <style>
      /* The panel is 380px by Chrome's own sizing; nothing here sets a width.
         No remote font: the CSP forbids remote anything, and a font that
         fails to load silently changes every measurement in the scorecard. */
      html, body { margin: 0; padding: 0; background: #17141f; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #f2eefb;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      /* The date and time controls are the OS's own (`<input type="date">` is
         the native picker), so the only honest way to make them match a dark
         panel is to tell the OS which scheme this document is. Restyling
         their internals is not possible and faking them would lose the
         picker, which is the whole reason they are primitives. */
      :root { color-scheme: dark; }
      input[type="date"], input[type="time"] {
        background: #221d2e;
        color: #f2eefb;
        border: 1px solid #332c42;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/panel/main.tsx"></script>
  </body>
</html>
